[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cathay-ush-offsetalign"
version = "0.1.0"
description = "解析时间标记，排列引用位置与原文偏移的对齐的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cathay-ush" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cathay-ush.github.io"
Repository = "https://github.com/cathay-ush/offsetalign"
Issues = "https://github.com/cathay-ush/offsetalign/issues"

[project.scripts]
offsetalign = "offsetalign:main"

[tool.setuptools]
py-modules = ["offsetalign"]
